name: daily-refresh

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/daily_refresh.py

      - name: Commit & push artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/predictions_2026_27_finished.parquet \
                  data/processed/predictions_2026_27_upcoming.parquet \
                  reports/metrics_2026_27.json \
                  reports/daily_history.json \
                  reports/last_hold.json || true
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi
          git commit -m "daily refresh: predictions + metrics $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
